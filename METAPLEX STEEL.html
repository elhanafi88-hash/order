function Z(){return {prod:0,pack:0,sent:0,ret:0,pass:0,fail:0,deliv:0}}
function agg(skip){
  var M={};
  function g(o,i){var a=M[o]||(M[o]={});return a[i]||(a[i]=Z())}
  D.prod.forEach(function(r){if(r.id===skip)return;(r.lines||[]).forEach(function(l){g(r.orderId,l.itemId)[r.type==='pack'?'pack':'prod']+=n(l.qty)})});
  D.galv.forEach(function(r){
    if(r.id!==skip)(r.lines||[]).forEach(function(l){g(r.orderId,l.itemId).sent+=n(l.qty)});
    (r.returns||[]).forEach(function(x){(x.lines||[]).forEach(function(l){g(r.orderId,l.itemId).ret+=n(l.qty)})});
  });
  D.qc.forEach(function(r){if(r.id===skip)return;(r.lines||[]).forEach(function(l){var a=g(r.orderId,l.itemId);a.pass+=n(l.pass);a.fail+=n(l.fail)})});
  D.deliv.forEach(function(r){if(r.id===skip)return;(r.lines||[]).forEach(function(l){g(r.orderId,l.itemId).deliv+=n(l.qty)})});
  return M;
}
function sumLines(ls,key){return (ls||[]).reduce(function(s,l){return s+n(l[key||'qty'])},0)}
function dnOut(r){var rt2=0;(r.returns||[]).forEach(function(x){rt2+=sumLines(x.lines)});return Math.max(0,sumLines(r.lines)-rt2)}
function calcOrder(o,M){

    var a=(M[o.id]&&M[o.id][it.id])||Z(),gv=finOf(it)==='galv',px=finOf(it)==='powder';
    var c={it:it,gv:gv,px:px,qty:n(it.qty),prod:a.prod,sent:a.sent,ret:a.ret,pack:a.pack,pass:a.pass,fail:a.fail,deliv:a.deliv};
    c.back=gv?a.ret:a.prod;c.out=gv?Math.max(0,a.sent-a.ret):0;c.toPack=Math.max(0,c.back-a.pack);
    var ms=D.mats.filter(function(m){return m.orderId===o.id&&(!m.itemId||m.itemId===it.id)});c.mat=!ms.length?'none':(ms.some(function(m){return n(m.required)>n(m.received)})?'short':'ok');
    c.ready=Math.max(0,a.prod-a.deliv);c.remain=Math.max(0,c.qty-a.deliv);
    t.qty+=c.qty;t.prod+=c.prod;t.pack+=c.pack;t.pass+=c.pass;t.fail+=c.fail;t.deliv+=c.deliv;t.ready+=c.ready;t.out+=c.out;t.toPack+=c.toPack;
    if(gv){t.sent+=c.sent;t.ret+=c.ret}
    return c;
  });
  var st;
  if(o.status==='cancel')st='cancel';else if(o.status==='hold')st='hold';
  else if(t.qty>0&&t.deliv>=t.qty)st='done';else if(t.deliv>0)st='part';else if(t.ready>0)st='ready';
  else if(t.pack>0||t.pass>0)st='pack';else if(t.ret>0)st='back';else if(t.sent>0)st='galv';else if(t.prod>0)st='prod';else st='new';
  var closed=st==='done'||st==='cancel',td=today();
  var short=D.mats.filter(function(m){return m.orderId===o.id&&n(m.required)>n(m.received)});
  var matDate='',noDate=false;short.forEach(function(m){if(m.expected){if(m.expected>matDate)matDate=m.expected}else noDate=true});
  var matSt=!rows.length?'none':(rows.some(function(c){return c.mat==='short'})?'short':(rows.every(function(c){return c.mat==='none'})?'none':(rows.some(function(c){return c.mat==='none'})?'part':'ok')));
  var oms=D.mats.filter(function(m){return m.orderId===o.id});
  var matAvail=!oms.length?'reg':(oms.every(function(m){return n(m.received)>=n(m.required)})?'full':(oms.every(function(m){return n(m.received)<=0})?'none':'part'));
  var started='';D.prod.forEach(function(r){if(r.orderId===o.id&&r.type!=='pack'&&r.date&&(!started||r.date<started))started=r.date});
  var base=(o.startDate&&o.startDate>td)?o.startDate:td,start=started||(matDate&&matDate>base?matDate:base);
  var anyGv=rows.some(function(c){return c.gv||c.px});
  var pdur=(o.startDate&&o.prodEnd)?Math.max(0,dayDiff(o.prodEnd,o.startDate)):dv(o.prodDays,5);
  var est=addDays(start,pdur+(anyGv?dv(o.galvDays,3):0)+dv(o.finDays,divOf(o)==='bracket'?0:2));
  var late=(!closed&&st!=='hold'&&o.due&&dayDiff(o.due,td)<0)?-dayDiff(o.due,td):0;
  var oldest=0;
  D.galv.forEach(function(r){if(r.orderId===o.id&&dnOut(r)>0&&r.date){oldest=Math.max(oldest,dayDiff(td,r.date))}});
  var since='';
  if(t.ready>0){
    D.prod.forEach(function(r){if(r.orderId===o.id&&r.type==='pack'&&r.date>since)since=r.date});
    D.qc.forEach(function(r){if(r.orderId===o.id&&r.date>since)since=r.date});
  }
  var x={o:o,t:t,rows:rows,st:st,closed:closed,short:short,late:late,oldest:closed?0:oldest,since:since,matSt:matSt,matDate:matDate,noDate:noDate,started:started,start:start,est:est,pd:pdur,base:base,matAvail:matAvail,ci:0};
  x.flags=[];
  if(st==='hold')x.flags.push(['موقوف: '+hrName(o.holdReason)+(o.holdDate?' (من '+fd(o.holdDate)+')':''),'late']);
  if(late)x.flags.push(['متأخر '+late+(late===1?' يوم':' أيام'),'late']);
  if(!closed&&t.fail>0)x.flags.push(['مرفوض QC: '+fq(t.fail),'late']);
  if(!closed&&short.length)x.flags.push(['نقص خامات ('+short.length+')','soon']);
  if(!closed&&x.oldest>=7)x.flags.push(['في الجلفنة من '+x.oldest+' يوم','soon']);
  if(!closed&&!started&&matDate&&matDate>base&&st!=='hold')x.flags.push(['الإنتاج هيتأخر لحد وصول الخامة '+fd(matDate),'soon']);
  var early=st==='new'||st==='prod'||st==='galv'||st==='back';
  if(!closed&&!started&&(matSt==='none'||matSt==='part')&&st!=='hold')x.flags.push(['الخامات مش متسجلة','soon']);
  if(early&&o.due&&est>o.due)x.flags.push(['المقترح '+fd(est)+' بعد المطلوب','soon']);
  if(!closed&&t.ready>0)x.flags.push(['جاهز للتسليم: '+fq(t.ready),'ok']);
  return x;
}

var ST={lang:'both',dir:'ltr',help:false};
try{var sv=JSON.parse(localStorage.getItem('mx-ui')||'{}');['lang','dir'].forEach(function(k){if(sv[k])ST[k]=sv[k]})}catch(e){}
function save(){try{localStorage.setItem('mx-ui',JSON.stringify({lang:ST.lang,dir:ST.dir}))}catch(e){}}
var O=new WeakMap();
function skip(n){for(var p=n.parentNode;p;p=p.parentNode){if(p.nodeType===1&&(p.hasAttribute('data-noi18n')||p.tagName==='SCRIPT'||p.tagName==='STYLE'||p.tagName==='TEXTAREA'))return true}return false}
function applyText(n){
  var o;
  if(O.has(n))o=O.get(n);else{o=n.nodeValue;if(!AR.test(o)||skip(n))return;O.set(n,o)}
  var v=o;
  if(ST.lang==='en')v=tr(o);
  else if(ST.lang==='both'&&LET.test(o)){var e=tr(o);if(e!==o)v=o.replace(/\s+$/,'')+' | '+e.trim()+(/\s$/.test(o)?' ':'')}
  if(n.nodeValue!==v)n.nodeValue=v;
}
var AT=['placeholder','aria-label','title'];
function applyAttrs(el){
  if(el.nodeType!==1||skip(el)&&!el.hasAttribute('data-noi18n'))return;
  if(el.closest&&el.closest('[data-noi18n]'))return;
  AT.forEach(function(a){
    var k='data-o-'+a;var o=el.hasAttribute(k)?el.getAttribute(k):el.getAttribute(a);
    if(o==null||!AR.test(o))return;
    if(!el.hasAttribute(k))el.setAttribute(k,o);
    var v=ST.lang==='ar'?o:(ST.lang==='en'?tr(o):(function(){var e=tr(o);return e===o?o:o+' | '+e})());
    if(el.getAttribute(a)!==v)el.setAttribute(a,v);
  });
}
function walk(root){
  if(!root)return;
  if(root.nodeType===3){applyText(root);return}
  if(root.nodeType!==1)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(applyText);
  applyAttrs(root);
  var els=root.querySelectorAll('[placeholder],[aria-label],[title]');
  for(var i=0;i<els.length;i++)applyAttrs(els[i]);
}
var obs,busy=false;
function observe(){obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
function onMut(recs){
  if(busy)return;busy=true;obs.disconnect();
  try{recs.forEach(function(r){
    if(r.type==='characterData'){O.delete(r.target);applyText(r.target)}
    else r.addedNodes.forEach(walk);
  })}finally{observe();busy=false}
}
function setDir(){
  var w=document.querySelector('.wrap'),p=document.getElementById('panel');
  [w,p].forEach(function(e){if(e){e.setAttribute('dir',ST.dir);e.setAttribute('lang',ST.lang==='en'?'en':'ar')}});
  document.body.classList.toggle('ltr',ST.dir==='ltr');
}
function refresh(){
  busy=true;obs.disconnect();
  try{
    setDir();walk(document.body);
    ['ar','en','both'].forEach(function(k){var b=document.getElementById('lang-'+k);if(b)b.setAttribute('aria-pressed',String(ST.lang===k))});
    var d=document.getElementById('btn-dir');if(d)d.textContent=ST.dir==='ltr'?'⇆ LTR':'⇆ RTL';
    var hb=document.getElementById('btn-help');if(hb)hb.setAttribute('aria-pressed',String(ST.help));
    document.body.classList.toggle('help-on',ST.help);
    document.documentElement.lang=ST.lang==='en'?'en':'ar';
  }finally{observe();busy=false}
}
/* ---- help ---- */
function origText(el){
  var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n,s='';
  while((n=w.nextNode()))s+=O.has(n)?O.get(n):n.nodeValue;
  return s.replace(/\s+/g,' ').trim();
}
function lookup(el){
  if(el.id&&HELP['#'+el.id])return HELP['#'+el.id];
  var t=origText(el);
  if(t&&HELP[t])return HELP[t];
  var ph=el.getAttribute&&el.getAttribute('data-o-placeholder');
  if(el.classList.contains('sel-s'))return HELP['+ سجّل'];
  if(el.matches('td.click'))return HELP['td.click'];
  if(ph&&HELP[ph])return HELP[ph];
  var t2=t.replace(/^[+↳]\s*/,'');
  if(t2&&HELP[t2])return HELP[t2];
  var tag=el.tagName.toLowerCase();
  return GEN[tag]||null;
}
var CTRL='button,a,select,input,textarea,th,td.click,.tab,.chip,label,.pill,.flag,h1,h2,h3,.tile,[role=tab]';
var pop;
function hidePop(){if(pop)pop.hidden=true}
function showHelp(el){
  var hp=lookup(el);
  if(!pop){pop=document.createElement('div');pop.id='hp';pop.setAttribute('data-noi18n','');pop.setAttribute('role','status');document.body.appendChild(pop)}
  var isf=/^(SELECT|INPUT|TEXTAREA)$/.test(el.tagName);
  var label=(isf?(el.getAttribute('data-o-aria-label')||el.getAttribute('aria-label')||''):'')||origText(el)||el.getAttribute('aria-label')||el.getAttribute('data-o-placeholder')||el.getAttribute('placeholder')||el.tagName;
  var lab=ST.lang==='ar'?label:(ST.lang==='en'?tr(label):(tr(label)!==label?label+' | '+tr(label):label));
  var h='<b>'+lab.replace(/</g,'&lt;')+'</b>';
  if(hp){
    if(ST.lang!=='en')h+='<p dir="rtl" lang="ar">'+hp[0]+'</p>';
    if(ST.lang!=='ar')h+='<p dir="ltr" lang="en">'+hp[1]+'</p>';
  }else h+='<p>'+(ST.lang==='en'?'No explanation for this item.':'مفيش شرح للعنصر ده.')+'</p>';
  pop.innerHTML=h;pop.hidden=false;
  var r=el.getBoundingClientRect(),pw=Math.min(340,window.innerWidth-24);
  pop.style.width=pw+'px';
  var x=Math.max(12,Math.min(window.innerWidth-pw-12,r.left+r.width/2-pw/2));
  var y=r.bottom+8;pop.style.left=x+'px';pop.style.top=y+'px';
  var ph2=pop.offsetHeight;if(y+ph2>window.innerHeight-8)pop.style.top=Math.max(8,r.top-ph2-8)+'px';
}
function helpEvt(e){
  if(!ST.help)return;
  var t=e.target;if(!t||!t.closest)return;
  if(t.closest('#btn-help')||t.closest('#hp')||t.closest('#guide'))return;
  if(t.closest('#uibar')&&!t.closest('#btn-help')){e.preventDefault();e.stopPropagation();var c0=t.closest('#uibar button');if(c0)showHelp(c0);return}
  var c=t.closest(CTRL);
  e.preventDefault();e.stopPropagation();
  if(c&&e.type==='click')showHelp(c);
  else if(!c&&e.type==='click')hidePop();
}
['click','mousedown','pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,function(e){if(ev==='keydown'){if(e.key==='Escape'&&ST.help){ST.help=false;hidePop();refresh()}if(!ST.help||(e.key!=='Enter'&&e.key!==' '))return}helpEvt(e)},true)});
document.addEventListener('change',function(e){if(ST.help){e.stopPropagation()}},true);
/* ---- guide ---- */
function guide(){
  var g=document.getElementById('guide');
  if(g){g.remove();return}
  g=document.createElement('div');g.id='guide';g.setAttribute('data-noi18n','');
  var secs=[
    ['الأقسام','Sections',['شيت المتابعة','الأوردرات','جدول الإنتاج','شيت الخامات','طلبات الشراء','التسليم','التقارير']],
    ['أزرار فوق','Top buttons',['#btn-office','#btn-new','#lang-ar','#lang-en','#lang-both','#btn-dir','#btn-help','#btn-guide']],
    ['شيت المتابعة: الفلاتر','Tracking sheet: filters',['المفتوحة','المتأخرة','الكل','#tm','#tq','تصدير الشيت للمكتب','+ سجّل']],
    ['شيت المتابعة: الأعمدة','Tracking sheet: columns',['رقم الأوردر','اسم الأوردر','تاريخ الأوردر','الخامات','الرسمة','الكمية','التشطيب','اتنتج','يروح الجلفنة','يجهز للتسليم','اتسلّم','المتبقي','حالة الرسمة','التسليم المطلوب']],
    ['حالات الخامات','Materials statuses',['متوفر','متوفر جزئيًا','مش متوفر','مش متسجلة']],
    ['الخامات والشراء','Materials and purchasing',['+ خامة','استلام','سجّل الطلب','سجّل طلب كل الناقص النهارده','نسخ طلب الشراء كنص','مسح']],
    ['التسليم والتقارير','Delivery and reports',['+ تسجيل تسليم','سلّم كل جاهز الأوردر','انسخ النص','تحميل (يفتح في Excel)','حفظ','إغلاق']]
  ];
  var h='<div class="gbox" role="dialog" aria-modal="true"><div class="ghd"><b>'+(ST.lang==='en'?'Screen guide':(ST.lang==='ar'?'دليل الشاشة':'دليل الشاشة | Screen guide'))+'</b><button type="button" id="g-close" class="btn small">×</button></div><div class="gbody">';
  secs.forEach(function(s){
    h+='<h3>'+(ST.lang==='en'?s[1]:(ST.lang==='ar'?s[0]:s[0]+' | '+s[1]))+'</h3><dl>';
    s[2].forEach(function(k){
      var v=HELP[k];if(!v)return;
      var name=k.charAt(0)==='#'?{'#btn-office':'تقرير للمكتب','#btn-new':'+ أوردر جديد','#lang-ar':'عربي','#lang-en':'English','#lang-both':'AR+EN','#btn-dir':'⇆ LTR / RTL','#btn-help':'؟ شرح / Help','#btn-guide':'دليل / Guide','#tm':'الخامات','#tq':'بحث'}[k]:k;
      var nm=ST.lang==='en'?tr(name):(ST.lang==='ar'?name:(tr(name)!==name?name+' | '+tr(name):name));
      h+='<dt>'+nm.replace(/</g,'&lt;')+'</dt><dd>'+(ST.lang!=='en'?'<span dir="rtl" lang="ar">'+v[0]+'</span>':'')+(ST.lang!=='ar'?'<span dir="ltr" lang="en">'+v[1]+'</span>':'')+'</dd>';
    });
    h+='</dl>';
  });
  h+='</div></div>';g.innerHTML=h;document.body.appendChild(g);
  g.addEventListener('click',function(e){if(e.target===g||e.target.id==='g-close')g.remove()});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var g=document.getElementById('guide');if(g)g.remove()}});
/* ---- init ---- */
function init(){
  var bar=document.getElementById('uibar');
  function on(id,fn){var b=document.getElementById(id);if(b)b.addEventListener('click',function(e){if(ST.help)return;fn(e)})}
  on('lang-ar',function(){ST.lang='ar';save();refresh()});
  on('lang-en',function(){ST.lang='en';save();refresh()});
  on('lang-both',function(){ST.lang='both';save();refresh()});
  on('btn-dir',function(){ST.dir=ST.dir==='ltr'?'rtl':'ltr';save();refresh()});
  on('btn-guide',guide);
  var hb=document.getElementById('btn-help');
  if(hb)hb.addEventListener('click',function(){ST.help=!ST.help;if(!ST.help)hidePop();else{var n=document.getElementById('notice');}refresh()});
  obs=new MutationObserver(onMut);
  refresh();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

</body></html>
